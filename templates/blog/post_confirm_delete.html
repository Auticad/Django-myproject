{% extends 'base.html' %}

{% block title %}Elimina post — MyProject{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white">Conferma eliminazione</div>
      <div class="card-body">
        <p>Stai per eliminare il post <strong>{{ object.title }}</strong>. L'operazione è irreversibile.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Sì, elimina</button>
            <a href="{{ object.get_absolute_url }}" class="btn btn-secondary">Annulla</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
