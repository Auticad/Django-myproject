version: '3.9'

# Sovrascrittura per sviluppo locale
# Uso: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:

  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - .:/app         # mount del codice sorgente per hot-reload
      - media_data:/app/media/
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
    command: python manage.py runserver 0.0.0.0:8000
