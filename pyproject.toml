[project]
name = "myproject"
version = "0.1.0"
description = "Django 5.2 LTS Full-Stack Project"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.*",
    "psycopg[binary]>=3.1",
    "python-decouple>=3.8",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "django-filter>=24.0",
    "django-redis>=5.4",
    "celery[redis]>=5.3",
    "django-celery-beat>=2.6",
    "django-celery-results>=2.5",
    "whitenoise>=6.7",
    "pillow>=10.0",
    "django-htmx>=1.18",
    "sentry-sdk[django]>=2.0",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "faker>=24.0",
    "django-debug-toolbar>=4.3",
    "ipython>=8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests/test_*.py", "apps/*/tests/test_*.py"]
addopts = "--strict-markers -v"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
