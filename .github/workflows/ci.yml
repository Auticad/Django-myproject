name: Django CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Test ──────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       test_db
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements-dev.txt

      - name: Esegui migrazioni
        env:
          SECRET_KEY:   ci-secret-key-only-not-for-production
          DEBUG:        "False"
          ALLOWED_HOSTS: localhost
          DB_NAME:      test_db
          DB_USER:      postgres
          DB_PASSWORD:  postgres
          DB_HOST:      localhost
          DB_PORT:      "5432"
          REDIS_URL:    redis://localhost:6379/0
        run: python manage.py migrate --noinput

      - name: Esegui test con coverage
        env:
          SECRET_KEY:   ci-secret-key-only-not-for-production
          DEBUG:        "False"
          ALLOWED_HOSTS: localhost
          DB_NAME:      test_db
          DB_USER:      postgres
          DB_PASSWORD:  postgres
          DB_HOST:      localhost
          DB_PORT:      "5432"
          REDIS_URL:    redis://localhost:6379/0
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage a Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

      - name: Verifica sicurezza deployment
        env:
          SECRET_KEY:   ci-secret-key-only-not-for-production
          DEBUG:        "False"
          ALLOWED_HOSTS: mysite.com
          DB_NAME:      test_db
          DB_USER:      postgres
          DB_PASSWORD:  postgres
          DB_HOST:      localhost
          DB_PORT:      "5432"
          REDIS_URL:    redis://localhost:6379/0
        run: python manage.py check --deploy
        continue-on-error: true

  # ─── Build immagine Docker ────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login al GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Estrai metadata Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy su VPS ────────────────────────────────────
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /app
            git pull origin main
            docker-compose pull
            docker-compose up -d --no-deps --build web celery celery-beat
            docker-compose exec -T web python manage.py migrate --noinput
            docker-compose exec -T web python manage.py collectstatic --noinput
            # Rimuovi immagini obsolete
            docker image prune -f
            echo "Deploy completato: $(date)"
